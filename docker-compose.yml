services:

  ai-router:
    build:
      context: ./router
      dockerfile: Dockerfile
    container_name: ai-router
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ai_router_data:/data
      - ./config:/config:ro
    env_file:
      - path: .env
        required: false
    environment:
      - SQLITE_PATH=/data/memory.db
      - ROUTING_CONFIG_PATH=/config/routing.yaml
      - TOOLS_CONFIG_PATH=/config/tools.yaml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/status')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ai-net

volumes:
  ai_router_data:
    driver: local

networks:
  ai-net:
    driver: bridge
